# Release builds: pushing a v* tag builds the static app and attaches a
# ready-to-serve codeatlas-dist.zip to a GitHub Release, so anyone can run
# CodeAtlas offline without cloning or building. The zip holds the
# production dist including the precache service worker; it needs any static
# file server because ES modules and workers do not run from file://.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dist-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Production build
        run: bun run build

      - name: Zip the static build
        run: |
          cd dist
          zip -r ../codeatlas-dist.zip .

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" codeatlas-dist.zip \
            --title "CodeAtlas ${{ github.ref_name }}" \
            --generate-notes || \
          gh release upload "${{ github.ref_name }}" codeatlas-dist.zip --clobber
