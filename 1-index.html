<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>CodeAtlas</title>
    <meta name="description" content="Paste any GitHub repo - get an interactive architecture map and chat that answers from the actual code, with file:line citations." />
    <meta name="theme-color" content="#1E1033" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CodeAtlas" />
    <!-- Open Graph / Twitter card. og:image is root-relative: swap to an
         absolute URL (plus canonical + og:url) once the production domain
         is known. Until then scrapers that require absolute URLs skip it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeAtlas" />
    <meta property="og:title" content="CodeAtlas - See any codebase as a map" />
    <meta property="og:description" content="Paste any GitHub repo - get an interactive architecture map and chat that answers from the actual code, with file:line citations." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeAtlas - See any codebase as a map" />
    <meta name="twitter:description" content="Paste any GitHub repo - get an interactive architecture map and chat that answers from the actual code, with file:line citations." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
